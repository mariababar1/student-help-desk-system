<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign In | Student Help Desk</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header class="site-header"><a class="brand" href="index.html">Student Help Desk</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="register.html">Registration</a><a href="login.html">Sign In</a><a href="contact.html">Contact Us</a></nav></header>
<main class="form-wrap"><section class="form-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p class="muted">Use your registered email address.</p>
<form id="loginForm" novalidate>
<label for="loginEmail">Email address</label><input id="loginEmail" name="email" type="email" autocomplete="email" required maxlength="254"><small class="error" id="loginEmailError"></small>
<label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="64"><small class="error" id="loginPasswordError"></small>
<button class="button" type="submit">Sign in</button><p id="loginMessage" class="message" role="status" aria-live="polite"></p>
</form><p class="muted">New here? <a href="register.html">Create an account</a></p></section></main><footer>Student Help Desk System · SCD Semester Project</footer>
</body></html>
