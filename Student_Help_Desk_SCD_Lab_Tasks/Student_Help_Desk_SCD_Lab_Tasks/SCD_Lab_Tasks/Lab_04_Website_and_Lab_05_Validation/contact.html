<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact Us | Student Help Desk</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header class="site-header"><a class="brand" href="index.html">Student Help Desk</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="register.html">Registration</a><a href="login.html">Sign In</a><a href="contact.html">Contact Us</a></nav></header>
<main class="form-wrap"><section class="form-card"><p class="eyebrow">WE ARE HERE TO HELP</p><h1>Contact us</h1><p class="muted">Send a message to the student support team.</p>
<form id="contactForm" novalidate>
<label for="contactName">Full name</label><input id="contactName" name="name" required minlength="2" maxlength="60" pattern="[A-Za-z][A-Za-z .'-]{1,59}"><small class="error" id="contactNameError"></small>
<label for="contactEmail">Email address</label><input id="contactEmail" name="email" type="email" required maxlength="254"><small class="error" id="contactEmailError"></small>
<label for="subject">Subject</label><input id="subject" name="subject" required minlength="3" maxlength="100"><small class="error" id="subjectError"></small>
<label for="message">Message</label><textarea id="message" name="message" rows="5" required minlength="10" maxlength="1000"></textarea><small class="error" id="messageError"></small>
<button class="button" type="submit">Send message</button><p id="contactResponse" class="message" role="status" aria-live="polite"></p>
</form></section></main><footer>Student Help Desk System · SCD Semester Project</footer>
</body></html>
